<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark">
  <style>
    body {
      zoom: 1.2;
    }
  </style>
  <!-- <link rel="preload" href="fonts/noto-sans.woff2" as="font" type="font/woff2" crossorigin /> -->
  <link rel="preload" as="style" href="css/style-popup.css" />
  <link rel="stylesheet" href="css/style-popup.css" />
  <link rel="preload" as="script" href="src/popup.js" crossorigin />
  <script type="module" src="src/popup.js"></script>
</head>

<body>
  <!-- introduces white square bug -->
  <!-- <img src="images/pusheencat.png" id="kofi" /> -->

  <!-- TODO: add zh_TW and zh_CN -->

  <label for="fontType" id="fontTypeLabel" hidden>Font</label>
  <select name="fontType" id="fontType" hidden>
    <option value="PingFang">PingFang (default)</option>
    <option value="Baoli">Baoli</option>
    <option value="Hannotate">Hannotate</option>
    <option value="HanziPen">HanziPen</option>
    <option value="LingWai">LingWai</option>
    <option value="Times">Times</option>
    <option value="Wawati">Wawati</option>
    <option value="Xingkai">Xingkai</option>
    <option value="Yuanti">Yuanti</option>
    <option value="Kaiti">Kaiti</option>
  </select>
  <select name="fontTypeSafari" id="fontTypeSafari" hidden>
    <option value="PingFang">PingFang (default)</option>
    <option value="Heiti">Heiti</option>
    <option value="Songti">Songti</option>
  </select>

  <label for="dayLimit">Study today</label>
  <select name="dayLimit" id="dayLimit">
    <option value="5">5 words</option>
    <option value="10">10 words</option>
    <option value="15">15 words</option>
    <option value="20">20 words</option>
    <option value="0">All words</option>
  </select>

  <label for="level">Level</label>
  <select name="level" id="level">
    <!-- substituted in popup.js:restoreSettings() -->
  </select>

  <label for="char" id="charLabel" hidden>Characters<sup style="font-size: 8px;"> (HSK only)</sup></label>
  <select name="char" id="char" hidden>
    <option value="simplified">Simplified</option>
    <option disabled>🇨🇳 China</option>
    <!-- <option disabled>🇸🇬 Singapore</option> -->
    <option disabled></option>
    <option value="traditional">Traditional</option>
    <option disabled>🇭🇰 Hong Kong</option>
    <option disabled>🇲🇴 Macau</option>
    <option disabled>🇹🇼 Taiwan</option>
  </select>

  <label for="testType">Test</label>
  <select name="testType" id="testType">
    <option value="hsk3">HSK</option>
    <option disabled>🇨🇳 China</option>
    <option disabled>🇭🇰 Hong Kong</option>
    <option disabled>🇲🇴 Macau</option>
    <option disabled></option>
    <option value="tocfl">TOCFL</option>
    <option disabled>🇹🇼 Taiwan</option>
  </select>

  <!-- <br /> -->

  <!-- <div id="checkboxOptions"> -->
    <label class="cb" for="sentenceExamples"><input type="checkbox" id="sentenceExamples" name="sentenceExamples" />
      Tap to open dictionary
      <!--      <span id="info" title="Click the word">ℹ</span>--></label>

    <label class="cb" for="pinyin"><input type="checkbox" id="pinyin" name="pinyin" /> Pinyin</label>

  <label class="cb" for="zhuyin"><input type="checkbox" id="zhuyin" name="zhuyin" /> Zhuyin</label>


  <!-- TODO add support for TOCFL -->
  <div id="translationLabel" hidden><label class="cb" for="translation"><input type="checkbox" id="translation"
        name="translation" />
      Translation<sup style="font-size: 8px;"> (HSK only)</sup></label></div>

  <!-- TODO add support for TOCFL -->
  <div id="colorLabel" hidden><label class="cb" for="color"><input type="checkbox" id="color" name="color" /> Tone
      colors<sup style="font-size: 8px;"> (HSK only)</sup></label></div>
  <!-- <hr align="center" width="100%"> -->

  <label class="cb" for="ai" id="aiLabel" hidden><input type="checkbox" id="ai" name="ai" hidden /> Sentence example
    (AI)</label>
  <!-- </div> -->

  <div id="aiSettings" hidden>
    <br />
    <label for="customModel">Model name (Ollama) <span id="info" title="Run `ollama list` to see the list of available models">ℹ️</span></label>
    <input type="text" name="customModel" id="customModel" placeholder="gemma3:latest">

    <label for="customPrompt">Custom prompt <span id="info" title="{word}, {translation}, {pinyin}, {zhuyin} are available for substitution. {translation} is currently unavailable for TOCFL test. Leave empty for default.">ℹ️</span></label>
    <textarea name="customPrompt" id="customPrompt" placeholder="Leave empty for default"></textarea>

    <label class="cb" for="keepInRAM"><input type="checkbox" id="keepInRAM" name="keepInRAM" /> Keep model in RAM <span
        id="info"
        title="By default models are kept in memory for 5 minutes before being unloaded. This allows for quicker response times if you are making numerous requests to the LLM. Turn on during study sessions or if you have a lot of RAM.">⚠️</span></label>
  </div>

  <button id="support">
    <div id="supportText">ɴᴇxᴛ-ʟᴇᴠᴇʟ ᴛɪᴘs ʏᴏᴜ ɴᴇᴇᴅ ᴏɴ</div>
    <div id="supportTextAI" hidden>ɢᴜɪᴅᴇ ꜰᴏʀ ᴜꜱɪɴɢ ᴀɪ ᴏɴ</div>
    <strong><span id="supportLink">ᴄʜɪɴᴇsᴇᴛᴀʙ.ᴄᴏᴍ</span></strong>
  </button>

  <!-- <input type="button" id="feedback" value="Share feedback" /> -->

  <!-- TODO: make a game too? -->
  <!-- <img src="images/panda.png" id="panda" draggable="false" /> -->
  <!-- <img src="images/corner.png" id="panda" draggable="false" title="" /> -->

  <!-- <script src="src/popup.js"></script> -->
</body>

</html>
